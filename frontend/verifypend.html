<link rel="manifest" href="/static/site.webmanifest?v=4"><title>Hepozy — Check your email</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet"><style>*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}html{--bg: #1a1a1a;--surface: #242424;--orange: #e8600a;--orange-h: #d05508;--text: #efefef;--muted: #777}body{min-height:100vh;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;color:var(--text);padding:32px 20px}.card{width:100%;max-width:400px;background:var(--bg);border-radius:16px;padding:40px 36px 32px;text-align:center}.card-logo{display:block;width:40px;height:40px;object-fit:contain;margin:0 auto 22px}.icon{width:56px;height:56px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:24px;color:#fff}h1{font-size:20px;font-weight:600;margin-bottom:10px}p{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:6px}.email{color:var(--text);font-weight:500}.footer-link{margin-top:24px;font-size:12.5px;color:var(--muted)}.footer-link a{color:var(--orange);text-decoration:none;font-weight:500}.footer-link a:hover{text-decoration:underline}</style></head><body><div class="card"><img class="card-logo" src="hepozy.jpg" alt="Hepozy" width="40" height="40" onerror="this.style.visibility='hidden'"><h1>Check your email</h1><p>We sent a confirmation link to</p><p class="email" id="emailDisplay">your email</p><p style="margin-top: 16px;">Click the link to verify your account, then come back and log in.</p><div class="footer-link">Wrong email? <a href="register.html">Sign up again</a></div><div class="footer-link"><a href="login.html">Back to log in</a></div></div><script>const email=sessionStorage.getItem("pending_verification_email");email&&(document.getElementById("emailDisplay").textContent=email);</script></body></html>
